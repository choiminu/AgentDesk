// ── Phase columns (right panel, drop zones) ──
function renderPhaseColumns() {
  const el = $('orch-phase-cols');
  let html = '';
  for (const p of PHASES) {
    const assigned = orchTerminals.filter(t =>
      phaseAssignments[t.handle]?.phases?.includes(p.id)
    );
    html += `<div class="phase-column" data-phase="${p.id}" style="border-top-color:${p.color}">`
      + `<div class="phase-column-head">`
      + `<span class="phase-dot" style="background:${p.color}"></span>`
      + `${esc(p.label)}<span class="phase-column-count">${assigned.length}</span></div>`
      + `<div class="phase-column-body">`;
    if (!assigned.length) {
      html += '<div class="phase-empty">드래그해서 추가</div>';
    }
    for (const t of assigned) {
      const name = lastPathSeg(t.worktreePath || t.worktree || '') || t.handle;
      const agent = t.agentIdentity || 'shell';
      html += `<div class="phase-session-card">`
        + `<span class="agent-badge" style="font-size: var(--fs-sm);padding:1px 4px">${esc(agent)}</span>`
        + `<div class="ps-info"><div class="ps-name">${esc(name)}</div>`
        + `<div class="ps-handle">${esc(t.handle)}</div></div>`
        + `<div class="ps-actions">`
        + `<button class="ps-btn" data-action="send" data-handle="${esc(t.handle)}" title="프롬프트 전송">✎</button>`
        + `<button class="ps-btn" data-action="switch" data-handle="${esc(t.handle)}" title="터미널 전환">↗</button>`
        + `<button class="ps-btn rm" data-action="remove" data-handle="${esc(t.handle)}" data-phase="${p.id}" title="제거">×</button>`
        + `</div></div>`;
    }
    html += '</div></div>';
  }
  el.innerHTML = html;

  // Drop zone events on each phase column
  el.querySelectorAll('.phase-column').forEach(col => {
    col.addEventListener('dragover', e => {
      if (e.dataTransfer.types.includes('application/x-orca-terminal-handle')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        col.classList.add('drag-over');
      }
    });
    col.addEventListener('dragleave', e => {
      if (col.contains(e.relatedTarget)) return;
      col.classList.remove('drag-over');
    });
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      const handle = e.dataTransfer.getData('application/x-orca-terminal-handle');
      if (!handle) return;
      assignPhase(handle, col.dataset.phase);
      renderPhaseColumns();
    });
  });

  // Button events for phase session cards
  el.querySelectorAll('.ps-btn').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const { action, handle, phase } = btn.dataset;
      if (action === 'remove') {
        unassignPhase(handle, phase);
        renderPhaseColumns();
      } else if (action === 'switch') {
        window.orca.terminalSwitch(handle);
      } else if (action === 'send') {
        const prompt = window.prompt('프롬프트 입력:');
        if (prompt && prompt.trim()) {
          await window.orca.orchSendToTerminal(handle, prompt.trim());
        }
      }
    });
  });
}

// ── Task lanes ──
async function loadOrchTasks() {
  try {
    const raw = await window.orca.orchTasks(selectedRunId || undefined);
    orchTasks = raw?.result?.tasks || [];
    renderOrchTaskLanes();
  } catch { orchTasks = []; renderOrchTaskLanes(); }
}

function detectPhase(spec) {
  if (!spec) return null;
  for (const p of PHASES) {
    if (spec.startsWith(p.tag)) return p.id;
  }
  return null;
}

function stripPhaseTag(spec) {
  if (!spec) return '';
  for (const p of PHASES) {
    if (spec.startsWith(p.tag)) return spec.slice(p.tag.length).trim();
  }
  return spec;
}

function renderOrchTaskLanes() {
  const el = $('orch-task-lanes');
  if (!orchTasks.length) {
    el.innerHTML = '<div class="empty" style="height:60px"><span class="empty-icon" style="font-size:20px">📋</span><span class="empty-text">태스크가 없습니다</span></div>';
    return;
  }

  const byPhase = new Map();
  const untagged = [];
  for (const p of PHASES) byPhase.set(p.id, []);

  for (const t of orchTasks) {
    const phase = detectPhase(t.spec || t.task_title);
    if (phase && byPhase.has(phase)) byPhase.get(phase).push(t);
    else untagged.push(t);
  }

  let html = '';
  for (const p of PHASES) {
    const tasks = byPhase.get(p.id);
    html += `<div class="task-lane">`
      + `<div class="task-lane-header"><span class="phase-dot" style="background:${p.color}"></span>`
      + `${esc(p.label)} <span style="color:var(--text3);font-weight:400">${tasks.length}</span></div>`
      + `<div class="task-lane-body">`;
    for (const t of tasks) {
      const title = stripPhaseTag(t.spec || t.task_title || t.id);
      const st = (t.status || 'pending').toLowerCase();
      html += `<div class="task-card" draggable="true" data-task-id="${esc(t.id)}">`
        + `<div class="task-title">${esc(trunc(title, 60))}</div>`
        + `<div class="task-status ${st}">${esc(st)}</div>`
        + `</div>`;
    }
    if (!tasks.length) html += '<div class="orch-empty">비어있음</div>';
    html += '</div></div>';
  }

  if (untagged.length) {
    html += `<div class="task-lane">`
      + `<div class="task-lane-header"><span class="phase-dot" style="background:var(--text3)"></span>`
      + `미분류 <span style="color:var(--text3);font-weight:400">${untagged.length}</span></div>`
      + `<div class="task-lane-body">`;
    for (const t of untagged) {
      const title = t.spec || t.task_title || t.id;
      const st = (t.status || 'pending').toLowerCase();
      html += `<div class="task-card" draggable="true" data-task-id="${esc(t.id)}">`
        + `<div class="task-title">${esc(trunc(title, 60))}</div>`
        + `<div class="task-status ${st}">${esc(st)}</div>`
        + `</div>`;
    }
    html += '</div></div>';
  }

  // Worker drop zone at the end for task→terminal dispatch
  html += `<div class="task-lane" style="min-width:160px">`
    + `<div class="task-lane-header" style="color:var(--accent)">↓ 배정 영역</div>`
    + `<div class="task-lane-body" id="orch-worker-zones">`;
  for (const t of orchTerminals) {
    const name = lastPathSeg(t.worktreePath || t.worktree || '') || t.handle;
    html += `<div class="worker-drop-zone" data-handle="${esc(t.handle)}">`
      + `${esc(name)}</div>`;
  }
  if (!orchTerminals.length) html += '<div class="orch-empty">터미널 없음</div>';
  html += '</div></div>';

  el.innerHTML = html;

  // Drag events for task cards
  el.querySelectorAll('.task-card[draggable]').forEach(card => {
    card.addEventListener('dragstart', e => {
      e.dataTransfer.setData('application/x-orca-task-id', card.dataset.taskId);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
  });

  // Drop zones for worker assignment
  el.querySelectorAll('.worker-drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => {
      if (e.dataTransfer.types.includes('application/x-orca-task-id')) {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        zone.classList.add('drag-over');
      }
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
    zone.addEventListener('drop', async e => {
      e.preventDefault();
      zone.classList.remove('drag-over');
      const taskId = e.dataTransfer.getData('application/x-orca-task-id');
      if (!taskId) return;
      zone.textContent = '배정 중...';
      zone.classList.add('dispatching');
      try {
        await window.orca.orchDispatch(taskId, zone.dataset.handle);
        zone.textContent = '배정 완료 ✓';
        setTimeout(() => loadOrchTasks(), 1500);
      } catch (err) {
        zone.textContent = '오류: ' + (err.message || '실패');
        zone.classList.remove('dispatching');
        zone.classList.add('err');
      }
    });
  });
}

// ── Shared: extract terminal tail lines from orca response ──
function extractTail(res) {
  const tail = res?.result?.terminal?.tail;
  if (Array.isArray(tail) && tail.length) return tail;
  return [];
}

function extractLastResponse(lines) {
  let lastPromptIdx = -1;
  let lastDoneIdx = -1;
  for (let i = lines.length - 1; i >= 0; i--) {
    const t = lines[i].trim();
    if (t.includes('✻') && t.includes('done') && lastDoneIdx === -1) {
      lastDoneIdx = i;
    }
    if (t.startsWith('❯') && t.length > 5 && lastDoneIdx > i) {
      lastPromptIdx = i;
      break;
    }
  }
  if (lastPromptIdx < 0 || lastDoneIdx <= lastPromptIdx) return '';
  const block = lines.slice(lastPromptIdx + 1, lastDoneIdx);
  const responseLines = [];
  for (const line of block) {
    const t = line.trim();
    if (!t) continue;
    if (t.startsWith('⏺')) {
      responseLines.push(t.slice(1).trim());
    } else {
      responseLines.push(t);
    }
  }
  return responseLines.join('\n').trim();
}

function detectTerminalStatus(lines) {
  for (let i = lines.length - 1; i >= 0; i--) {
    const t = lines[i].trim();
    if (t === '❯' || (t.startsWith('❯') && t.length <= 3)) return 'idle';
    if (t.startsWith('⏵') || t.includes('bypass permissions') || t.includes('branch:')) continue;
    if (t.includes('[OMC#') || t.startsWith('────')) continue;
    if (t.includes('✻') && t.includes('done')) return 'idle';
    if (t.startsWith('❯') && t.length > 5) return 'busy';
    if (t.startsWith('⏺') || t.length > 0) return 'busy';
  }
  return 'offline';
}

// ── Debate Room ──
const debateState = {
  running: false,
  groupA: [],
  groupB: [],
  master: null,
  topic: '',
  mode: 'debate',
  maxRounds: 3,
  log: [],
  round: 0,
  currentHandle: null,
};

function renderCollabTree() {
  const el = $('collab-tree');
  const mode = $('debate-mode').value;
  const isMW = mode === 'master-worker';
  const { master, groupA, groupB } = debateState;

  if (!master && !groupA.length && !groupB.length) {
    el.innerHTML = '<div class="collab-tree-empty">세션을 왼쪽에서 드래그하여 배치하면<br>계층 구조가 표시됩니다</div>';
    return;
  }

  const nodeHtml = (handle, cls) => {
    const name = resolveHandleName(handle);
    const sid = [...handles.entries()].find(([, v]) => v === handle)?.[0];
    const s = sessions.find(ss => ss.id === sid);
    const dotColor = s ? (DEBATE_STATUS_COLORS[s.status] || 'var(--text3)') : 'var(--text3)';
    return `<div class="collab-node ${cls}"><span class="dot" style="background:${dotColor}"></span>${esc(name)}</div>`;
  };

  const branchHtml = (handles, cls, label, labelCls) => {
    let h = '';
    h += `<div class="ct-branch">`;
    h += `<div class="ct-vline ct-vline-short"></div>`;
    h += `<div class="ct-group-label ${labelCls}">${label}</div>`;
    h += `<div class="ct-node-stack">`;
    for (const hd of handles) h += nodeHtml(hd, cls);
    h += `</div></div>`;
    return h;
  };

  let html = '<div class="collab-tree-root">';

  if (isMW && master) {
    html += nodeHtml(master, 'collab-node-master');
    if (groupA.length || groupB.length) {
      html += '<div class="ct-vline ct-vline-long"></div>';
      html += '<div class="ct-hline"></div>';
      html += '<div class="ct-branches">';
      if (groupA.length) html += branchHtml(groupA, 'collab-node-worker-a', 'Group A', 'ct-group-label-a');
      if (groupB.length) html += branchHtml(groupB, 'collab-node-worker-b', 'Group B', 'ct-group-label-b');
      html += '</div>';
      html += '<div class="ct-flow-badge"><span class="arrow">↑</span> 워커 간 토론 후 결과를 마스터에게 전달</div>';
    }
  } else {
    if (groupA.length || groupB.length) {
      html += '<div class="ct-branches" style="align-items:center">';
      if (groupA.length) {
        html += `<div class="ct-branch">`;
        html += `<div class="ct-group-label ct-group-label-a">Group A</div>`;
        html += `<div class="ct-node-stack">`;
        for (const h of groupA) html += nodeHtml(h, 'collab-node-worker-a');
        html += `</div></div>`;
      }
      html += '<div class="ct-relay-arrow">⇄</div>';
      if (groupB.length) {
        html += `<div class="ct-branch">`;
        html += `<div class="ct-group-label ct-group-label-b">Group B</div>`;
        html += `<div class="ct-node-stack">`;
        for (const h of groupB) html += nodeHtml(h, 'collab-node-worker-b');
        html += `</div></div>`;
      }
      html += '</div>';
      html += '<div class="ct-flow-badge"><span class="arrow">↔</span> A ↔ B 릴레이 토론</div>';
    }
  }

  html += '</div>';
  el.innerHTML = html;
}

$('debate-mode').addEventListener('change', () => {

const masterZoneEl = $('debate-zone-master');
masterZoneEl.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; masterZoneEl.classList.add('drag-over'); });
masterZoneEl.addEventListener('dragleave', () => masterZoneEl.classList.remove('drag-over'));
masterZoneEl.addEventListener('drop', e => {

function renderMasterZone() {
  const el = $('debate-zone-master');
  if (!debateState.master) {
    el.innerHTML = '<div class="debate-dropzone-empty">마스터 세션을 드롭</div>';

const DEBATE_STATUS_COLORS = { running: 'var(--accent)', waiting: 'var(--yellow)', done: 'var(--text3)', error: 'var(--red)' };

function getDebateSessions() {
  const cutoff = Date.now() - 24 * 60 * 60 * 1000;
  return sessions.filter(s => {
    if (!handles.get(s.id)) return false;
    if (s.status === 'running' || s.status === 'waiting') return true;
    return s.time && s.time > cutoff;
  }).sort((a, b) => {
    const order = { running: 0, waiting: 1, done: 2, error: 3 };
    const diff = (order[a.status] ?? 9) - (order[b.status] ?? 9);
    return diff !== 0 ? diff : (b.time || 0) - (a.time || 0);
  });
}

function resolveHandleName(handle) {
  const sid = [...handles.entries()].find(([, v]) => v === handle)?.[0];
  return sessions.find(s => s.id === sid)?.name || handle.slice(0, 12);
}

function isHandleAssigned(handle) {
  return debateState.groupA.includes(handle) || debateState.groupB.includes(handle) || debateState.master === handle;
}

function renderDebateSessionList() {
  const el = $('debate-session-list');
  const list = getDebateSessions();
  if (!list.length) {
    el.innerHTML = '<span style="color:var(--text3);font-size:var(--fs-xs)">최근 세션이 없습니다</span>';
    return;
  }
  let html = '';
  for (const s of list) {
    const handle = handles.get(s.id);
    if (!handle || isHandleAssigned(handle)) continue;
    const dotColor = DEBATE_STATUS_COLORS[s.status] || 'var(--text3)';
    html += `<div class="debate-tag" draggable="true" data-handle="${esc(handle)}">` +
      `<span class="dot" style="background:${dotColor}"></span>${esc(s.name)}</div>`;
  }
  el.innerHTML = html || '<span style="color:var(--text3);font-size:var(--fs-xs)">모든 세션이 배치되었습니다</span>';
  el.querySelectorAll('.debate-tag[draggable]').forEach(tag => {
    tag.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', tag.dataset.handle);
      e.dataTransfer.effectAllowed = 'move';
      tag.classList.add('dragging');
    });
    tag.addEventListener('dragend', () => tag.classList.remove('dragging'));
  });
}

function renderZone(zoneId, group, color) {
  const el = $(zoneId);
  if (!group.length) {
    el.innerHTML = '<div class="debate-dropzone-empty">여기에 드롭</div>';
    return;
  }
  let html = '';
  for (const handle of group) {
    const name = resolveHandleName(handle);
    const sid = [...handles.entries()].find(([, v]) => v === handle)?.[0];
    const s = sessions.find(ss => ss.id === sid);

    html += `<div class="debate-tag" data-handle="${esc(handle)}">` +
      `<span class="dot" style="background:${dotColor}"></span>${esc(name)}` +

['debate-zone-a', 'debate-zone-b'].forEach(zoneId => {

    renderCollabTree();

});

function buildRelayPrompt(mode, topic, round, maxRounds, myName, peerNames, lastPeerMsg) {
  const peersStr = peerNames.join(', ');
  const modeLabel = mode === 'brainstorm' ? '브레인스톰' : mode === 'review' ? '코드리뷰' : '토론';
  const header = `[${modeLabel} - 라운드 ${round}/${maxRounds}]\n다른 세션(${peersStr})과 "${topic}" 주제로 대화 중입니다.\n메시지를 중계해 드리겠습니다. 상대에게 전달할 답변만 작성해 주세요.\n\n`;

  if (!lastPeerMsg) {
    return `${header}첫 번째 발언자입니다. "${topic}"에 대해 현재 작업의 맥락에서 의견을 3~5문장으로 제시해 주세요.`;
  }

  const relay = `상대 세션(${lastPeerMsg.name})의 메시지:\n\"\"\"${lastPeerMsg.text}\"\"\"\n\n`;
  if (mode === 'brainstorm') return `${header}${relay}위 의견을 참고하여 아이디어를 발전시키거나 새로운 제안을 3~5문장으로 해 주세요.`;
  if (mode === 'review') return `${header}${relay}위 의견에 대해 코드리뷰 관점에서 3~5문장으로 답변하세요.`;
  return `${header}${relay}위 의견에 대해 동의 또는 반론을 3~5문장으로 제시해 주세요.`;
}

async function sendAndCollect(handle, prompt, group) {
  debateState.currentHandle = handle;
  const name = resolveHandleName(handle);
  const singleLinePrompt = prompt.replace(/\n+/g, ' ').trim();
  console.log(`[debate] sending to ${name} (${handle}), length: ${singleLinePrompt.length}`);

  try {
    const sendRes = await window.orca.terminalSend(handle, singleLinePrompt, true, 15);
    const stages = sendRes?.result?.send?.prompt?.stages || [];
    console.log(`[debate] send stages:`, stages);
    if (!sendRes?.result?.send?.accepted) {
      debateLog(null, `${name}: 전송이 거부되었습니다`, 'system');
      return null;
    }
    if (!stages.includes('turn_started')) {
      debateLog(null, `${name}: 세션이 처리를 시작하지 않았습니다 (입력 대기 상태인지 확인하세요)`, 'system');
      return null;
    }
  } catch (err) {
    console.error(`[debate] send error:`, err);
    debateLog(null, `${name}: 전송 실패 (${err.message})`, 'system');
    return null;
  }

  debateStatus(`${name} 응답 대기 중...`);
  try {
    await window.orca.terminalWait(handle, 'tui-idle', 180000);
    await new Promise(r => setTimeout(r, 800));
  } catch (err) {
    console.warn(`[debate] wait timeout/error:`, err);
  }

  if (!debateState.running) return null;

  let cleaned = '';
  try {
    const screenRes = await window.orca.terminalRead(handle, true);
    const lines = extractTail(screenRes);
    console.log(`[debate] screen after: ${lines.length} lines`);
    cleaned = extractLastResponse(lines);
    console.log(`[debate] extracted response (${cleaned.length} chars):`, cleaned.slice(0, 300));
  } catch (err) {
    console.warn(`[debate] screen read failed:`, err);
  }

  if (cleaned.length > 1500) cleaned = cleaned.slice(0, 1500) + '...';
  console.log(`[debate] final response (${cleaned.length} chars):`, cleaned.slice(0, 200));
  debateLog(handle, cleaned || '(응답 없음)', 'msg', group);
  debateState.currentHandle = null;
  return { name, text: cleaned || '(응답 없음)' };
}

async function runDebate() {
  const { groupA, groupB, topic, mode, maxRounds } = debateState;
  debateState.log = [];

  const namesA = groupA.map(h => resolveHandleName(h));
  const namesB = groupB.map(h => resolveHandleName(h));
  debateLog(null, `시작: [${namesA.join(', ')}] ↔ [${namesB.join(', ')}] | "${topic}" | ${maxRounds}라운드`, 'system');

  let lastMsgFromA = null;
  let lastMsgFromB = null;

  for (let round = 1; round <= maxRounds; round++) {
    debateState.round = round;
    if (!debateState.running) break;
    debateLog(null, `── 라운드 ${round}/${maxRounds} ──`, 'system');

    for (const handle of groupA) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`A: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt(mode, topic, round, maxRounds, myName, namesB, lastMsgFromB);
      lastMsgFromA = await sendAndCollect(handle, prompt, 'a');
    }
    if (!debateState.running) break;

    for (const handle of groupB) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`B: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt(mode, topic, round, maxRounds, myName, namesA, lastMsgFromA);
      lastMsgFromB = await sendAndCollect(handle, prompt, 'b');
    }
  }

  debateLog(null, debateState.running ? '토론이 완료되었습니다.' : '토론이 중단되었습니다.', 'system');
  debateStatus('');
  debateState.running = false;
  $('debate-start-btn').disabled = false;
  $('debate-stop-btn').disabled = true;
}

async function runMasterWorker() {
  const { groupA, groupB, master, topic, maxRounds } = debateState;
  debateState.log = [];

  const workers = [...groupA, ...groupB];
  const workerNames = workers.map(h => resolveHandleName(h));
  const masterName = resolveHandleName(master);
  debateLog(null, `마스터-워커 시작: 마스터(${masterName}) | 워커(${workerNames.join(', ')}) | "${topic}" | ${maxRounds}라운드`, 'system');

  const workerGroupA = groupA;
  const workerGroupB = groupB;
  const namesA = workerGroupA.map(h => resolveHandleName(h));
  const namesB = workerGroupB.map(h => resolveHandleName(h));

  let lastMsgFromA = null;
  let lastMsgFromB = null;

  for (let round = 1; round <= maxRounds; round++) {
    debateState.round = round;
    if (!debateState.running) break;
    debateLog(null, `── 워커 토론 라운드 ${round}/${maxRounds} ──`, 'system');

    for (const handle of workerGroupA) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`워커 A: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt('debate', topic, round, maxRounds, myName, namesB, lastMsgFromB);
      lastMsgFromA = await sendAndCollect(handle, prompt, 'a');
    }
    if (!debateState.running) break;

    for (const handle of workerGroupB) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`워커 B: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt('debate', topic, round, maxRounds, myName, namesA, lastMsgFromA);
      lastMsgFromB = await sendAndCollect(handle, prompt, 'b');
    }
  }

  if (!debateState.running) {
    debateLog(null, '중단되었습니다.', 'system');
    debateStatus('');
    debateState.running = false;
    $('debate-start-btn').disabled = false;
    $('debate-stop-btn').disabled = true;
    return;
  }

  debateLog(null, `── 워커 토론 완료, 마스터에게 결과 전달 ──`, 'system');
  debateStatus(`마스터(${masterName})에게 최종 결과 전달 중...`);

  const allMessages = debateState.log
    .filter(m => m.type === 'msg')
    .map(m => `[${m.group === 'a' ? 'A' : 'B'}] ${resolveHandleName(m.sender)}: ${m.text}`);

  let condensed = allMessages.join(' | ');
  if (condensed.length > 3000) {
    const lastA = allMessages.filter(m => m.startsWith('[A]')).slice(-1)[0] || '';
    const lastB = allMessages.filter(m => m.startsWith('[B]')).slice(-1)[0] || '';
    condensed = `[최종 A 의견] ${lastA.slice(4)} | [최종 B 의견] ${lastB.slice(4)}`;
  }

  const summaryPrompt = `워커들이 "${topic}" 주제로 ${maxRounds}라운드 토론했습니다. 참여: ${workerNames.join(', ')}. 토론 요약: ${condensed} --- 위 내용을 분석하여 1)핵심 합의 2)쟁점 3)최종 결론을 정리해 주세요.`;

  console.log(`[debate] master prompt length: ${summaryPrompt.length}`);
  debateLog(null, `마스터에게 전달 중 (프롬프트 ${summaryPrompt.length}자)...`, 'system');

  const masterResult = await sendAndCollect(master, summaryPrompt, 'master');
  if (masterResult) {
    debateLog(null, `마스터(${masterName})의 최종 정리가 완료되었습니다.`, 'system');
  } else {
    debateLog(null, `마스터(${masterName})에게 전달하지 못했습니다. 마스터 세션이 입력 대기 상태(❯)인지 확인하세요.`, 'system');
  }

  debateLog(null, '마스터-워커 흐름이 완료되었습니다.', 'system');
  debateStatus('');
  debateState.running = false;
  $('debate-start-btn').disabled = false;
  $('debate-stop-btn').disabled = true;
}

$('debate-start-btn').addEventListener('click', () => {
  const topic = $('debate-topic').value.trim();
  if (!topic) { showInAppToast('주제를 입력하세요', 'error'); return; }
  const mode = $('debate-mode').value;
  if (mode === 'master-worker') {
    if (!debateState.master) { showInAppToast('마스터 세션을 배치하세요', 'error'); return; }
    const workers = [...debateState.groupA, ...debateState.groupB];
    if (workers.length < 2) { showInAppToast('워커 세션을 2개 이상 배치하세요 (A, B 그룹에 나눠서)', 'error'); return; }
  } else {
    if (!debateState.groupA.length || !debateState.groupB.length) {
      showInAppToast('A 그룹과 B 그룹에 각각 세션을 배치하세요', 'error');
      return;
    }
  }
  debateState.topic = topic;
  debateState.mode = mode;
  debateState.maxRounds = parseInt($('debate-rounds').value, 10);
  debateState.running = true;
  $('debate-start-btn').disabled = true;
  $('debate-stop-btn').disabled = false;
  if (mode === 'master-worker') runMasterWorker();
  else runDebate();
});

$('debate-stop-btn').addEventListener('click', () => {
  debateState.running = false;
  debateStatus('중단 중...');
  $('debate-stop-btn').disabled = true;
});

// CHAT PANEL (Dashboard)
// ══════════════════════════════════════════
let chatHandle = null;
let chatSending = false;

function openChat(handle) {
  chatHandle = handle;
  const kind = terminalKind(handle);
  $('chat-orca').textContent = t(kind === 'tmux' ? 'tmux 보기' : kind === 'terminal' ? '터미널 보기' : 'Orca 보기');
  $('chat-orca').title = t(kind === 'tmux' ? 'tmux 터미널로 전환' : kind === 'terminal' ? '터미널 탭으로 전환' : 'Orca 터미널로 전환');
  const panel = $('chat-panel');
  const activePage = document.querySelector('.page.active');
  if (activePage && panel.parentElement !== activePage) activePage.appendChild(panel);
  panel.classList.add('open');

  const sid = [...handles.entries()].find(([, v]) => v === handle)?.[0];
  const s = sessions.find(ss => ss.id === sid);
  $('chat-name').textContent = s?.name || handle.slice(0, 16);

  $('chat-screen').innerHTML = '<div class="chat-line-status">화면을 불러오는 중...</div>';
  $('chat-input').value = '';
  $('chat-input').disabled = false;
  $('chat-send').disabled = false;
  $('chat-input').focus();

  refreshChatScreen(handle);
}

async function refreshChatScreen(handle) {
  try {
    const res = await window.orca.terminalRead(handle, true);
    const lines = extractTail(res);
    renderChatScreen(lines);
    const status = detectTerminalStatus(lines);
    updateChatStatus(status);
  } catch (err) {
    $('chat-screen').innerHTML = `<div class="chat-line-status">화면 읽기 실패: ${esc(err.message)}</div>`;
    updateChatStatus('offline');
  }
}

function renderChatScreen(lines) {
  const el = $('chat-screen');
  let html = '';
  for (const line of lines) {
    const t = line.trim();
    if (!t) { html += '\n'; continue; }
    if (t.startsWith('❯')) {
      html += `<div class="chat-line-prompt">${esc(line)}</div>`;
    } else if (t.startsWith('⏺')) {
      html += `<div class="chat-line-response">${esc(line)}</div>`;
    } else if (t.includes('✻') && t.includes('done')) {
      html += `<div class="chat-line-done">${esc(line)}</div>`;
    } else if (t.startsWith('────') || t.includes('[OMC#') || t.includes('bypass permissions') || t.startsWith('branch:')) {
      html += `<div class="chat-line-status">${esc(line)}</div>`;
    } else {
      html += `<div class="chat-line-response">${esc(line)}</div>`;
    }
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function updateChatStatus(status) {
  const el = $('chat-status');
  el.className = 'chat-header-status ' + status;
  if (status === 'idle') el.textContent = '대기 중';
  else if (status === 'busy') el.textContent = '작업 중';
  else el.textContent = '오프라인';
}

async function sendChatMessage() {
  if (chatSending || !chatHandle) return;
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) return;

  chatSending = true;
  input.disabled = true;
  $('chat-send').disabled = true;
  updateChatStatus('busy');

  const el = $('chat-screen');
  el.innerHTML += `<div class="chat-line-prompt">❯ ${esc(text)}</div>`;
  el.innerHTML += `<div class="chat-line-status">전송 중...</div>`;
  el.scrollTop = el.scrollHeight;
  input.value = '';

  try {
    const sendRes = await window.orca.terminalSend(chatHandle, text, true, 15);
    const stages = sendRes?.result?.send?.prompt?.stages || [];
    if (!sendRes?.result?.send?.accepted) {
      el.innerHTML += `<div class="chat-line-status" style="color:var(--red)">전송이 거부되었습니다</div>`;
      chatSending = false;
      input.disabled = false;
      $('chat-send').disabled = false;
      return;
    }
    if (!stages.includes('turn_started')) {
      el.innerHTML += `<div class="chat-line-status" style="color:var(--yellow)">세션이 입력 대기 상태가 아닙니다</div>`;
      chatSending = false;
      input.disabled = false;
      $('chat-send').disabled = false;
      return;
    }

    el.innerHTML += `<div class="chat-line-status">응답 대기 중...</div>`;
    el.scrollTop = el.scrollHeight;

    await window.orca.terminalWait(chatHandle, 'tui-idle', 180000);
    await new Promise(r => setTimeout(r, 800));

    await refreshChatScreen(chatHandle);
  } catch (err) {
    el.innerHTML += `<div class="chat-line-status" style="color:var(--red)">오류: ${esc(err.message)}</div>`;
    el.scrollTop = el.scrollHeight;
  } finally {
    chatSending = false;
    input.disabled = false;
    $('chat-send').disabled = false;
    input.focus();
  }
}

$('chat-send').addEventListener('click', sendChatMessage);
$('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});
$('chat-close').addEventListener('click', () => {
  $('chat-panel').classList.remove('open');
  chatHandle = null;
});
$('chat-refresh').addEventListener('click', () => {
  if (chatHandle) refreshChatScreen(chatHandle);
});
$('chat-orca').addEventListener('click', () => {
  if (chatHandle) api.switchTo(chatHandle);
});

let ctxMenuEl = null;
function closeCtxMenu() { if (ctxMenuEl) { ctxMenuEl.remove(); ctxMenuEl = null; } }
function openSessionMenu(x, y, sess) {
  closeCtxMenu();
  const handle = handles.get(sess.id);
  const items = [];
  if (handle) items.push(['💬', '채팅 열기', () => openChat(handle)]);
  if (handle) items.push(['🖥', { tmux: 'tmux 터미널 보기', terminal: '터미널 탭 보기', Orca: 'Orca 터미널 보기' }[terminalKind(handle)], () => api.switchTo(handle)]);
  items.push(['📋', '세션 ID 복사', () => { window.orca.clipboardWrite(sess.id); showInAppToast('세션 ID 복사됨'); }]);
  if (sess.hookOnly && sess.sessionId && !handle) items.push(['▶', '터미널에서 다시 열기 (claude --resume)', () => resumeSessionInTerminal(sess)]);
  items.push(['✏️', '이름 변경', () => { const v = prompt(t('위젯에 표시할 이름 (비우면 원래 이름)'), sess.name); if (v !== null) setNameOverride(sess.id, v); }]);
  if (officeChars.has(sess.id)) items.push(['🎨', '캐릭터 바꾸기', () => { officeSetSkin(sess.id, officeSkin(sess.id) + 1); const c = officeChars.get(sess.id); if (c) c.reactT = 1.2; }]);
  if (handle && (sess.status === 'running' || sess.status === 'waiting')) items.push(['⏸', '인터럽트 (Esc)', () => api.interrupt(handle)]);
  for (const it of (typeof teamMenuItems === 'function' ? teamMenuItems(sess) : [])) items.push(it);
  for (const it of (typeof zoneMenuItems === 'function' ? zoneMenuItems(sess) : [])) items.push(it);
  if (handle) items.push(['✕', '세션 종료', async () => { if (confirm(`${sess.name} ${t('세션을 종료할까요?')}`)) { await api.close(handle); fetchData(); } }, 'danger']);
  openItemsMenu(x, y, sess.name, items);
}
// items: [icon, label, onClick, cssClass?]
function openItemsMenu(x, y, title, items) {
  closeCtxMenu();
  const el = document.createElement('div');
  el.className = 'ctx-menu';
  el.innerHTML = `<div class="ctx-title">${esc(title)}</div>` + items.map((it, i) => `<button data-i="${i}" class="${it[3] || ''}"><span>${it[0]}</span>${esc(t(it[1]))}</button>`).join('');
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; closeCtxMenu(); items[+b.dataset.i][2](); });
  document.body.appendChild(el);
  const r = el.getBoundingClientRect();
  el.style.left = Math.min(x, window.innerWidth - r.width - 6) + 'px';
  el.style.top = Math.min(y, window.innerHeight - r.height - 6) + 'px';
  ctxMenuEl = el;
}
document.addEventListener('mousedown', e => { if (ctxMenuEl && !ctxMenuEl.contains(e.target)) closeCtxMenu(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (ctxMenuEl) { closeCtxMenu(); return; }
    if ($('team-modal')) { closeTeamModal(); return; }
    const panel = $('chat-panel');
    if (panel.classList.contains('open')) { panel.classList.remove('open'); chatHandle = null; }
  }
});
$('list').addEventListener('contextmenu', e => {
  const row = e.target.closest('.session'); if (!row) return;
  const sess = sessions.find(ss => ss.id === row.dataset.id); if (!sess) return;
  e.preventDefault(); openSessionMenu(e.clientX, e.clientY, sess);
});

const BUBBLE_BASE = [
  '_BBBBBBBBB_',
  'BFFFFFFFFFB',
  'BFFFFFFFFFB',
  'BFFFFFFFFFB',
  'BFFFFFFFFFB',
  'BFFFFFFFFFB',
  'BFFFFFFFFFB',
  'BFFFFFFFFFB',

  '_____B_____',

const BUBBLE_GLYPH = {
  check: ['........', '.......X', '......X.', '.X...X..', '..X.X...', '...X....'],
  bang:  ['...X....', '...X....', '...X....', '...X....', '........', '...X....'],
  zz:    ['XXX.....', '..X.....', '.X..XXX.', 'X.....X.', '.....X..', '....XXX.'],

  ask:   ['.XXXX...', 'X....X..', '....X...', '...X....', '........', '...X....'],

  if (officeReady && now - officeLastDraw >= 31) { officeLastDraw = now; officeFrame(now); }
  officeRaf = requestAnimationFrame(officeLoop);
}
function officeStart() {
  officeStartedAt = performance.now();
  officeLastT = 0;
  officeLoadImages().then(() => {
    if (!officeRaf && currentPage === 'office') officeRaf = requestAnimationFrame(officeLoop);
  });
}
function officeStop() {
  if (officeRaf) { cancelAnimationFrame(officeRaf); officeRaf = null; }
  $('office-tip').hidden = true;
  officeHover = null;
}

function officeCharAt(evt) {
  const canvas = $('office-canvas');
  const rect = canvas.getBoundingClientRect();
  const scale = canvas.__scale || 2;
  const x = (evt.clientX - rect.left) / scale;
  const y = (evt.clientY - rect.top) / scale;
  const all = [...officeChars.values()].filter(c => !c.fading && c.sess);
  // nearer (larger y) first so overlapping sprites pick the one drawn on top
  all.sort((a, b) => b.y - a.y);
  const hit = all.find(c => x >= c.x - 9 && x <= c.x + 9 && y >= c.y - 26 && y <= c.y + 9);
  if (hit) return hit;
  const seat = officeSeats.find(st => st.ch && x >= st.x && x < st.x + st.w && y >= st.y && y < st.y + st.h);
  return seat ? seat.ch : null;
}
$('office-canvas').addEventListener('mousemove', e => {
  const ch = officeCharAt(e);
  const tip = $('office-tip');
  const canvas = $('office-canvas');
  officeHover = ch;
  const onPet = !ch ? officePetHit(e) : null;
  const zs = !ch && !onPet ? officeZoneSeatAt(officeWorldPos(e).x, officeWorldPos(e).y) : null;
  const onBoard = !ch && !onPet && !zs && officeBoardHit(e);
  const onSign = !ch && !onPet && !zs && !onBoard && officeSignHit(e);
  canvas.classList.toggle('hit', !!ch || !!onPet || onBoard || onSign);
  if (!ch) {
    if (!onPet && !zs && !onBoard && !onSign) { tip.hidden = true; return; }
    tip.innerHTML = onSign ? '<b>' + esc(officeCompany) + '</b><span>' + t('회사 간판 · 클릭해서 이름 변경') + '</span>'
      : zs ?`<b>${esc(zs.zone.icon)} ${esc(t(zs.zone.name))}</b><span style="display:block;max-width:260px;white-space:normal;color:var(--text2)">${esc(zs.zone.prompt.slice(0, 140))}${zs.zone.prompt.length > 140 ? '…' : ''}</span><span style="display:block;color:#5fc7b3;margin-top:2px">${t('드래그해 놓으면 이 프롬프트를 보냅니다')}${zs.zone.auto ? ' · ' + t('확인 없이 바로 보내기') : ''}</span>`
      : onBoard ? '<b>' + t('화이트보드') + '</b><span>' + t('클릭: 가장 오래 기다리는 세션으로 이동해 채팅 열기') + '</span>'
      : `<b>${esc(onPet.name)}</b><span>` + t('휴게실 펫 · 클릭하면 좋아합니다') + '</span>';
    const wr0 = $('office-wrap').getBoundingClientRect();
    tip.style.left = (e.clientX - wr0.left + 12) + 'px'; tip.style.top = (e.clientY - wr0.top + $('office-wrap').scrollTop + 12) + 'px';
    tip.hidden = false; return;
  }
  const s = ch.sess;
  const stLabel = t({ running: '작업 중', waiting: '입력 대기', done: '쉬는 중', error: '오류' }[s.status] || s.status);
  const station = OFFICE_STATIONS.find(st => st.id === ch.station);
  const target = s.toolInput ? String(s.toolInput).split('/').pop().slice(0, 40) : '';
  const since = ch.statusSince ? ` (${officeFmtSince(ch.statusSince)})` : '';
  const ctxTxt = s.ctxPct != null ? ` · ctx ${s.ctxPct}%` : '';
  const msg = s.lastMsg ? `<span style="display:block;max-width:220px;white-space:normal;color:var(--text2);margin-top:2px">${esc(String(s.lastMsg).replace(/\s+/g, ' ').slice(0, 90))}</span>` : '';
  const tm = teamOf(ch.sid);
  const tmTask = tm?.tasks?.[ch.sid];
  const briefWarn = tmTask && tmTask.briefVersion != null && tmTask.briefVersion < tm.briefVersion ? '<span style="display:block;color:#F2C037;margin-top:2px">' + t('⚠ 브리프가 갱신되어 문맥이 오래되었습니다 · 우클릭 → 브리프 다시 전달') + '</span>' : '';
  const zn = zoneOf(ch.sid);
  const zoneTxt = zn ? `<span style="display:block;color:#5fc7b3;margin-top:2px">${esc(zn.icon)} ${esc(zn.name)} (${officeFmtSince(zoneState.assign[ch.sid].sentAt)})</span>` : '';
  let teamTxt = '';
  if (tm && tm.pm === ch.sid) {
    const all = Object.values(tm.tasks || {}), pending = all.filter(k => !k.reported).length;
    teamTxt = `<span style="display:block;color:#efb041;margin-top:2px">` + t(`👑 PM · 브리프 v${tm.briefVersion} · 라운드 ${tm.rounds || 0} · 진행 ${pending} / 보고 ${all.length - pending}${tm.autoDispatch ? ' · 자동 진행' : ''}`) + `</span>`;
  } else if (tmTask) {
    teamTxt = `<span style="display:block;max-width:240px;white-space:normal;color:#ffd98a;margin-top:2px">${tmTask.reported ? t('✓ 보고 완료') : '▶ ' + esc(String(tmTask.task).replace(/\s+/g, ' ').slice(0, 80))}${tmTask.done_when && !tmTask.reported ? t(' · 완료 조건: ') + esc(String(tmTask.done_when).slice(0, 40)) : ''}${tmTask.sentAt ? ' (' + officeFmtSince(tmTask.sentAt) + ')' : ''}</span>`;
  }
  tip.innerHTML = `<b>${esc(s.name)}</b><span>${esc(s.branch || '')} · ${stLabel}${since}${s.tool ? ' · ' + esc(s.tool) : ''}${target ? ' ' + esc(target) : ''}${station && s.status !== 'done' ? ' · ' + t(station.label) : ''}${ctxTxt}</span>${msg}${zoneTxt}${teamTxt}${briefWarn}`;
  const wrap = $('office-wrap');
  const wr = wrap.getBoundingClientRect();
  tip.style.left = (e.clientX - wr.left + 12) + 'px';
  tip.style.top = (e.clientY - wr.top + wrap.scrollTop + 12) + 'px';
  tip.hidden = false;
});
$('office-canvas').addEventListener('mouseleave', () => { officeHover = null; $('office-tip').hidden = true; });
let officeClickTimer = null;
$('office-canvas').addEventListener('click', e => {
  if (officeSuppressClick) return;
  const ch = officeCharAt(e);
  if (!ch) {
    const pet = officePetHit(e); if (pet) { pet.heartT = 1.6; return; }
    if (officeSignHit(e)) { officeCompanyEdit(); return; }
    if (officeBoardHit(e)) officeJumpToWaiting();
    return;
  }
  ch.reactT = 1.2;
  if (officeClickTimer) return;           // second click of a double-click is handled below
  officeClickTimer = setTimeout(() => {
    officeClickTimer = null;
    const handle = officeHandleFor(ch);
    if (handle) openChat(handle);
    else if (ch.sess && ch.sess.hookOnly && ch.sess.sessionId) resumeSessionInTerminal(ch.sess);
    else if (!String(ch.sid).startsWith('demo-')) showInAppToast(t('터미널 핸들을 찾을 수 없습니다'), 'error');
  }, 220);
});
$('office-canvas').addEventListener('contextmenu', e => {
  const ch = officeCharAt(e);
  if (!ch || !ch.sess) {
    const p = officeWorldPos(e); const zs = officeZoneSeatAt(p.x, p.y);
    if (zs) { e.preventDefault(); openItemsMenu(e.clientX, e.clientY, `${zs.zone.icon} ${zs.zone.name}`, zoneCellMenuItems(zs.zone)); }
    return;
  }
  e.preventDefault(); ch.reactT = 1.2;
  openSessionMenu(e.clientX, e.clientY, ch.sess.isSub ? (sessions.find(x => x.id === ch.sess.parentId) || ch.sess) : ch.sess);
});
$('office-canvas').addEventListener('dblclick', e => {
  clearTimeout(officeClickTimer); officeClickTimer = null;
  const ch = officeCharAt(e);
  if (!ch) return;
  const handle = officeHandleFor(ch);
  if (handle) api.switchTo(handle);
});

// ══════════════════════════════════════════
// TEAMS: drag agents into a PM-led team; PM writes the brief and hands out tasks
// ══════════════════════════════════════════
const TEAM_ROLES = { dev: '개발', research: '조사', exec: '실행·테스트', docs: '문서화' };
const TEAM_ROLES_EN = { dev: 'Dev', research: 'Research', exec: 'Exec/Test', docs: 'Docs' };
let teamState = { teams: {} };   // id → { id, pm, members:{sid:role}, brief, briefVersion, goal, log:[], rounds, autoDispatch, tasks:{sid:{task,done_when,sentAt,reported}} }
let officeDrag = null;           // { ch, x, y, startX, startY, moved }
let teamBlocksCache = [];
const teamFlights = [];

async function teamsLoad() {
  if (OFFICE_DEMO) {
    teamState = { teams: { demo: { id: 'demo', pm: 'demo-4', members: { 'demo-1': 'dev', 'demo-8': 'docs' }, brief: '## 목표\n캐시 전략 결정\n\n[갱신 v2]\n범위 축소: Redis만 평가', briefVersion: 2, goal: '캐시 전략 결정', log: [], rounds: 1, autoDispatch: false,
      tasks: { 'demo-1': { task: 'Redis 캐시 어댑터 초안 구현', done_when: '단위 테스트 통과', sentAt: Date.now(), reported: false, briefVersion: 1 } } } } };
    let demoFlip = false;
    setInterval(() => { demoFlip = !demoFlip; teamFlights.push(demoFlip ? { fromSid: 'demo-4', toSid: 'demo-1', t: 0, dur: 1.5, kind: 'dispatch' } : { fromSid: 'demo-1', toSid: 'demo-4', t: 0, dur: 1.5, kind: 'report' }); }, 4500);
    return;
  }
  try { const d = await window.orca.teamsRead(); if (d && d.teams) teamState = d; } catch {}
}
let teamsSaveTimer = null;
function teamsSave() {
  if (OFFICE_DEMO) return;
  clearTimeout(teamsSaveTimer);
  teamsSaveTimer = setTimeout(() => window.orca.teamsWrite(teamState).catch(() => {}), 300);
}
teamsLoad();

function teamOf(sid) { for (const t of Object.values(teamState.teams)) if (t.pm === sid || t.members[sid]) return t; return null; }
function teamRoleOf(sid) { const t = teamOf(sid); return t ? (t.pm === sid ? 'pm' : t.members[sid]) : null; }
function teamUnpin(sid) {
  const t = teamOf(sid); if (!t) return;
  if (t.pm === sid) t.pm = null; else delete t.members[sid];
  if (!t.pm && !Object.keys(t.members).length) delete teamState.teams[t.id];
  teamsSave();
}
function teamNew() {
  const id = 't' + Date.now().toString(36);
  teamState.teams[id] = { id, pm: null, members: {}, brief: '', briefVersion: 0, goal: '', log: [], rounds: 0, autoDispatch: false, tasks: {} };
  return teamState.teams[id];
}
function teamLog(t, type, text, extra = {}) {
  t.log.push({ t: Date.now(), type, text: String(text).slice(0, 4000), ...extra });
  if (t.log.length > 300) t.log.shift();
  teamsSave();
}

// layout: one block per team (PM seat first, then members); a template block appears while dragging
function officeBuildTeams(y0, originX, cols, SEAT_PX, SEAT_PY, aisleY, mode = 'teams') {
  const out = [];
  let y = y0;
  const teams = Object.values(teamState.teams);
  // the "new team" template only exists while a drag is actually in progress, and is laid out
  // separately (just above the lounge) so existing desks never shift when someone merely clicks
  const showTemplate = mode === 'template' && officeDrag && officeDrag.moved && !officeDrag.ch.sess.isSub && !teams.some(t => !t.pm);
  const list = mode === 'template' ? (showTemplate ? [{ id: '__template', pm: null, members: {}, template: true }] : []) : teams;
  for (const t of list) {
    const pmCh = t.pm && !zonePinned(t.pm) ? officeChars.get(t.pm) : null;
    const memberChs = Object.keys(t.members).filter(sid => !zonePinned(sid)).map(sid => officeChars.get(sid)).filter(Boolean);
    const n = 1 + Math.max(memberChs.length, t.template ? 1 : 0);
    const rowsN = Math.max(1, Math.ceil(n / cols));
    const tb = { team: t, template: !!t.template, y, rowsN, h: rowsN * SEAT_PY, seats: [], pmSeat: null, rect: { x: 4, y: y - 12, w: 0, h: rowsN * SEAT_PY } };
    for (let i = 0; i < Math.max(n, cols === 1 ? n : Math.min(n + 1, cols * rowsN)); i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const sx = originX + col * SEAT_PX, sy = y + row * SEAT_PY;
      const ch = i === 0 ? (pmCh && !pmCh.fading ? pmCh : null) : (memberChs[i - 1] || null);
      const seat = { sx, sy, deskX: sx + 16, deskY: sy + 18, chairX: sx + 40, chairY: sy + 62, aisleY: sy + SEAT_PY - 8, ch, st: null, teamSeat: true, isPm: i === 0, role: ch && i > 0 ? t.members[ch.sid] : null, team: t };
      if (ch) { ch.seat = seat; ch.meeting = false; }
      if (i === 0) tb.pmSeat = seat;
      tb.seats.push(seat);
    }
    for (let r = 0; r < rowsN; r++) aisleY.push(y + r * SEAT_PY - 8);
    out.push(tb);
    y += tb.h;
  }
  if (mode === 'teams') teamBlocksCache = out; else teamBlocksCache = [...teamBlocksCache.filter(b => !b.template), ...out];
  return out;
}

function officeDrawTeamBlock(ctx, im, tb, worldW, originX, now, bob, pulse, pcFrame, zItems) {
  const team = tb.team;
  const pmName = team.pm ? (officeChars.get(team.pm)?.sess?.name || 'PM') : '';
  const label = tb.template ? '새 팀 · PM 자리에 놓으세요' : `팀 · ${pmName || 'PM 없음'} · ${Object.keys(team.members).length}명`;
  officeQueueSign(ctx, label, tb.template ? '#9a97a8' : '#efb041', tb.y - 11, worldW, originX);
  // dotted command lines PM → members
  const pm = tb.pmSeat;
  if (pm && pm.ch) {
    ctx.save(); ctx.setLineDash([2, 2]); ctx.strokeStyle = 'rgba(239,176,65,0.85)'; ctx.lineWidth = 1;
    for (const st of tb.seats) {
      if (st === pm || !st.ch) continue;
      const y0 = pm.sy + 10.5, y1 = st.sy + 10.5;
      ctx.beginPath(); ctx.moveTo(pm.sx + 40, y0);
      if (st.sy === pm.sy) ctx.lineTo(st.sx + 40, y1);
      else { ctx.lineTo(pm.sx + 76, y0); ctx.lineTo(pm.sx + 76, y1); ctx.lineTo(st.sx + 40, y1); }
      ctx.stroke();
    }
    ctx.restore();
  }
  for (const seat of tb.seats) {
    if (!seat.ch) {
      // empty slot: PM slot gets a crown outline, member slots a faint outline
      officeDrawRug(ctx, seat.sx + 8, seat.sy + 12, 64, 64, seat.isPm ? '#efb041' : '#b9b6c2', true);
      ctx.font = `${officeFontPx}px ${OFFICE_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillStyle = 'rgba(20,20,30,0.75)';
      ctx.fillText(seat.isPm ? 'PM' : t('팀원'), seat.sx + 40, seat.sy + 40);
      if (im.desk) { ctx.globalAlpha = 0.6; ctx.drawImage(im.desk, seat.deskX, seat.deskY); ctx.globalAlpha = 1; }
      continue;
    }
    zItems.push({ z: seat.chairY, draw: () => {
    officeDrawDeskSeat(ctx, im, seat, now, bob, pulse, pcFrame, OFFICE.SEAT_W * OFFICE.T, OFFICE.SEAT_H * OFFICE.T);
    // role / PM badge on the rug corner
    const badge = seat.isPm ? '👑 PM' : t(TEAM_ROLES[seat.role] || '팀원');
    ctx.font = `${officeFontPx}px ${OFFICE_FONT}`; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
    const bw = Math.round(ctx.measureText(badge).width + 6);
    ctx.fillStyle = seat.isPm ? '#efb041' : (OFFICE_STATIONS.find(x => x.id === seat.role)?.color || '#9a97a8');
    ctx.fillRect(seat.sx + 8, seat.sy + 12, bw, 10);
    ctx.fillStyle = '#12141c'; ctx.fillText(badge, seat.sx + 11, seat.sy + 12);
    // pending task tag
    const task = team.tasks && team.tasks[seat.ch.sid];
    if (task && !task.reported && !seat.isPm) {
      const tt = '▶ ' + String(task.task).replace(/\s+/g, ' ').slice(0, 12);
      const tw = Math.min(64, Math.round(ctx.measureText(tt).width + 6));
      ctx.fillStyle = 'rgba(12,14,22,0.85)'; ctx.fillRect(seat.sx + 8, seat.sy + 23, tw, 10);
      ctx.fillStyle = '#ffd98a'; ctx.fillText(tt, seat.sx + 11, seat.sy + 23);
    }
    if (task && task.briefVersion != null && task.briefVersion < team.briefVersion && !seat.isPm) {
      const bvt = t('⚠ 문맥 갱신 필요');
      const bvw = Math.round(ctx.measureText(bvt).width + 6);
      ctx.fillStyle = 'rgba(60,50,10,0.9)'; ctx.fillRect(seat.sx + 8, seat.sy + 34, bvw, 10);
      ctx.fillStyle = '#F2C037'; ctx.fillText(bvt, seat.sx + 11, seat.sy + 34);
    }
    } });
  }
}

function officeDrawTeamFlights(ctx) {
  for (const f of teamFlights) {
    const fromCh = officeChars.get(f.fromSid), toCh = officeChars.get(f.toSid);
    if (!fromCh || !toCh) continue;
    const fx = fromCh.seat ? fromCh.seat.chairX : fromCh.x, fy = (fromCh.seat ? fromCh.seat.chairY : fromCh.y) - 20;
    const tx = toCh.seat ? toCh.seat.chairX : toCh.x, ty = (toCh.seat ? toCh.seat.chairY : toCh.y) - 20;
    const p = Math.min(1, f.t / f.dur);
    const ep = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const x = Math.round(fx + (tx - fx) * ep);
    const y = Math.round(fy + (ty - fy) * ep - Math.sin(ep * Math.PI) * 14);
    if (f.kind === 'dispatch') {
      ctx.fillStyle = '#ffd98a'; ctx.fillRect(x - 3, y - 2, 7, 5);
      ctx.fillStyle = '#12141c';
      ctx.fillRect(x - 3, y - 2, 7, 1); ctx.fillRect(x - 3, y + 2, 7, 1);
      ctx.fillRect(x - 3, y - 2, 1, 5); ctx.fillRect(x + 3, y - 2, 1, 5);
      ctx.fillStyle = '#efb041';
      ctx.fillRect(x - 2, y - 1, 1, 1); ctx.fillRect(x + 2, y - 1, 1, 1);
      ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y, 1, 1);
    } else {
      ctx.fillStyle = '#b8e8cc'; ctx.fillRect(x - 2, y - 3, 5, 7);
      ctx.fillStyle = '#12141c';
      ctx.fillRect(x - 2, y - 3, 5, 1); ctx.fillRect(x - 2, y + 3, 5, 1);
      ctx.fillRect(x - 2, y - 3, 1, 7); ctx.fillRect(x + 2, y - 3, 1, 7);
      ctx.fillStyle = '#3ecf8e';
      ctx.fillRect(x - 1, y - 1, 3, 1); ctx.fillRect(x, y - 2, 1, 1);
    }
  }
}
// drag ghost + drop-zone highlights
function officeDrawDrag(ctx, im, teamBlocks, worldW) {
  if (!officeDrag || !officeDrag.moved) return;
  if (zoneBlockCache) {
    ctx.fillStyle = 'rgba(95,199,179,0.10)'; ctx.fillRect(4, zoneBlockCache.y - 12, worldW - 8, zoneBlockCache.h);
    ctx.strokeStyle = 'rgba(95,199,179,0.95)'; ctx.lineWidth = 1;
    for (const st of zoneBlockCache.seats) ctx.strokeRect(st.sx + 7.5, st.sy + 11.5, 65, 65);
  }
  for (const tb of teamBlocks) {
    ctx.fillStyle = 'rgba(239,176,65,0.10)'; ctx.fillRect(4, tb.y - 12, worldW - 8, tb.h);
    const pm = tb.pmSeat;
    if (pm && !pm.ch) { ctx.strokeStyle = 'rgba(239,176,65,0.95)'; ctx.lineWidth = 1; ctx.strokeRect(pm.sx + 7.5, pm.sy + 11.5, 65, 65); }
    else if (pm) { ctx.strokeStyle = 'rgba(120,170,255,0.9)'; ctx.lineWidth = 1; ctx.strokeRect(4.5, tb.y - 11.5, worldW - 9, tb.h - 1); }
  }
  const sheet = im[`char_${officeSkin(officeDrag.ch.sid)}`];
  if (sheet) { ctx.globalAlpha = 0.85; officeDrawChar(ctx, sheet, 0, 0, officeDrag.x, officeDrag.y, 1); ctx.globalAlpha = 1; }
  ctx.font = `${officeFontPx}px ${OFFICE_FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(12,14,22,0.85)'; ctx.fillRect(Math.round(officeDrag.x) - 60, Math.round(officeDrag.y) + 12, 120, 10);
  ctx.fillStyle = '#ffd98a'; ctx.fillText(t('PM 자리 또는 팀 블록에 놓기 · 밖에 놓으면 해제'), Math.round(officeDrag.x), Math.round(officeDrag.y) + 12);
}

function officeWorldPos(evt) {
  const canvas = $('office-canvas'); const rect = canvas.getBoundingClientRect(); const scale = canvas.__scale || 2;
  return { x: (evt.clientX - rect.left) / scale, y: (evt.clientY - rect.top) / scale };
}
function officeDropAt(ch, x, y) {
  const zs = officeZoneSeatAt(x, y);
  if (zs) { zoneDrop(ch, zs.zone); return; }
  for (const tb of teamBlocksCache) {
    if (y < tb.y - 12 || y >= tb.y - 12 + tb.h) continue;
    let t = tb.team;
    if (tb.template) t = teamNew();
    const pm = tb.pmSeat;
    const onPm = pm && x >= pm.sx && x < pm.sx + OFFICE.SEAT_W * OFFICE.T && y >= pm.sy && y < pm.sy + OFFICE.SEAT_H * OFFICE.T;
    teamUnpin(ch.sid);
    if (onPm || !t.pm) {
      if (t.pm && t.pm !== ch.sid) { showInAppToast('이미 PM이 있는 팀입니다', 'error'); return; }
      t.pm = ch.sid; teamLog(t, 'pm', `${ch.sess.name}이(가) PM이 되었습니다`);
    } else {
      t.members[ch.sid] = ch.station && TEAM_ROLES[ch.station] ? ch.station : 'dev';
      teamLog(t, 'join', `${ch.sess.name} 합류 (${TEAM_ROLES[t.members[ch.sid]]})`);
    }
    teamsSave(); return;
  }
  if (teamOf(ch.sid)) { teamUnpin(ch.sid); showInAppToast(`${ch.sess.name} 팀에서 해제`); }
}
$('office-canvas').addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const ch = officeCharAt(e);
  if (!ch || !ch.sess || ch.sess.isSub) return;
  const p = officeWorldPos(e);

  m.querySelector('#team-go').onclick = async () => {
    const goal = m.querySelector('#team-goal').value.trim(); if (!goal) return;
    t.goal = goal; t.autoDispatch = m.querySelector('#team-auto').checked; teamsSave();
    const status = m.querySelector('#team-status');
    m.querySelector('#team-go').disabled = true;
    try {
      status.textContent = 'PM이 브리프를 작성하는 중…';
      const briefText = await teamAsk(pmHandle, teamBriefPrompt(t, goal));
      const brief = teamParseBrief(briefText);
      if (!brief) throw new Error('브리프 형식을 읽지 못했습니다: ' + briefText.slice(0, 200));
      t.brief = brief; t.briefVersion += 1; teamLog(t, 'brief', brief, { version: t.briefVersion });
      status.textContent = 'PM이 업무 분배를 정하는 중…';
      const assignText = await teamAsk(pmHandle, teamAssignPrompt(t, `목표: "${goal}". 첫 라운드입니다.`));
      const plan = parseJsonLoose(assignText);
      if (!plan || !Array.isArray(plan.assign)) throw new Error('분배 JSON을 읽지 못했습니다: ' + assignText.slice(0, 200));
      closeTeamModal();
      teamReviewPlan(t, plan);
    } catch (e) { status.textContent = '실패: ' + e.message; m.querySelector('#team-go').disabled = false; }
  };
}
function teamResolveMember(t, name) {
  const n = String(name || '').trim().toLowerCase();
  for (const sid of Object.keys(t.members)) { const nm = (officeChars.get(sid)?.sess?.name || '').toLowerCase(); if (nm === n || nm.includes(n) || n.includes(nm)) return sid; }
  return null;
}
function teamReviewPlan(team, plan, auto = false) {
  if (plan.brief_update && plan.brief_update.trim()) { team.brief = team.brief + '\n\n[갱신 v' + (team.briefVersion + 1) + ']\n' + plan.brief_update.trim(); team.briefVersion += 1; teamLog(team, 'brief', plan.brief_update, { version: team.briefVersion }); }
  if (plan.note) teamLog(team, 'pm-note', plan.note);
  const items = plan.assign.map(a => ({ sid: teamResolveMember(team, a.to), to: a.to, task: a.task || '', done_when: a.done_when || '' }));
  if (plan.done) { teamLog(team, 'done', '팀 작업 완료: ' + (plan.note || '')); window.orca.notify(t('팀 작업 완료'), `${officeChars.get(team.pm)?.sess?.name || 'PM'}: ${plan.note || ''}`); return; }
  if (auto || team.autoDispatch) { teamDispatch(team, items); return; }
  const m = teamModal(`<h3>PM 분배안 승인</h3>${plan.note ? `<p>${esc(plan.note)}</p>` : ''}
    ${items.map((it, i) => `<div class="assign"><label><input type="checkbox" data-i="${i}" ${it.sid ? 'checked' : 'disabled'}> <b>${esc(it.to)}</b>${it.sid ? '' : ' <span style="color:var(--red)">(팀원 매칭 실패)</span>'}</label><textarea data-task="${i}">${esc(it.task)}</textarea><div style="color:var(--text3);margin-top:3px">완료 조건: ${esc(it.done_when)}</div></div>`).join('')}
    <div class="row"><button id="team-cancel">취소</button><span style="margin-left:auto"></span><button class="primary" id="team-send">선택한 팀원에게 전달</button></div>`);
  m.querySelector('#team-cancel').onclick = closeTeamModal;
  m.querySelector('#team-send').onclick = () => {
    const chosen = [];
    m.querySelectorAll('input[type=checkbox][data-i]').forEach(cb => { if (cb.checked) { const i = +cb.dataset.i; items[i].task = m.querySelector(`textarea[data-task="${i}"]`).value; chosen.push(items[i]); } });
    closeTeamModal(); teamDispatch(team, chosen);
  };
}
async function teamDispatch(t, items) {
  t.rounds = (t.rounds || 0) + 1; t.tasks = t.tasks || {};
  for (const it of items) {
    if (!it.sid) continue;
    const h = handles.get(it.sid); const name = officeChars.get(it.sid)?.sess?.name || it.to;
    if (!h) { teamLog(t, 'error', `${name}: 터미널 없음`); continue; }
    try {
      const r = await window.orca.terminalSend(h, teamMemberPrompt(t, t.members[it.sid], it).replace(/\r?\n+/g, ' '), true, 15);
      if (!r?.result?.send?.accepted) throw new Error('전송 거부');
      t.tasks[it.sid] = { task: it.task, done_when: it.done_when, sentAt: Date.now(), reported: false, briefVersion: t.briefVersion };
      teamLog(t, 'dispatch', it.task, { to: name });
      const ch = officeChars.get(it.sid); if (ch) ch.reactT = 1.5;
      if (ch?.seat) teamFlights.push({ fromSid: t.pm, toSid: it.sid, t: 0, dur: 1.0, kind: 'dispatch' });
    } catch (e) { teamLog(t, 'error', `${name}: ${e.message}`); showInAppToast(`${name} 전달 실패: ${e.message}`, 'error'); }
  }
  teamsSave();
}
// a member whose task was handed out under an older brief gets the current brief again, keeping the same task
async function teamResendBrief(team, sid) {
  const h = handles.get(sid); const task = team.tasks && team.tasks[sid]; const name = officeChars.get(sid)?.sess?.name || sid;
  if (!h || !task) { showInAppToast(t('전달할 터미널 또는 과제가 없습니다'), 'error'); return; }
  try {
    const msg = `[브리프 갱신 v${team.briefVersion}] 팀 브리프가 바뀌었습니다. 아래 최신 브리프를 기준으로 진행 중인 과제를 이어서 수행하세요. ` + teamMemberPrompt(team, team.members[sid], task);
    const r = await window.orca.terminalSend(h, msg.replace(/\r?\n+/g, ' '), true, 15);
    if (!r?.result?.send?.accepted) throw new Error('전송 거부');
    task.briefVersion = team.briefVersion; teamLog(team, 'brief-resend', `브리프 v${team.briefVersion} 재전달`, { to: name });
    if (team.pm) teamFlights.push({ fromSid: team.pm, toSid: sid, t: 0, dur: 1.0, kind: 'dispatch' });
    const ch = officeChars.get(sid); if (ch) ch.reactT = 1.5;
    teamsSave(); showInAppToast(t(`${name}에게 브리프 v${team.briefVersion} 전달`));
  } catch (e) { teamLog(team, 'error', `${name}: ${e.message}`); showInAppToast(t(`${name} 전달 실패: ${e.message}`), 'error'); }
}
// report loop: a member with a pending task goes running → waiting ⇒ collect its report and ask the PM for the next step
const teamPrevStatus = new Map();
let teamLoopBusy = false;
async function teamTick() {
  if (teamLoopBusy) return;
  for (const t of Object.values(teamState.teams)) {
    if (!t.pm || !t.tasks) continue;
    for (const [sid, task] of Object.entries(t.tasks)) {
      const sess = sessions.find(x => x.id === sid); if (!sess) continue;
      const prev = teamPrevStatus.get(sid); teamPrevStatus.set(sid, sess.status);
      if (task.reported || !(prev === 'running' && sess.status === 'waiting') || Date.now() - task.sentAt < 5000) continue;
      teamLoopBusy = true;
      try {
        const h = handles.get(sid); const res = await window.orca.terminalRead(h, true);
        const report = teamParseReport(extractLastResponse(extractTail(res)) || '');
        task.reported = true; task.report = report; teamLog(t, 'report', report, { from: sess.name });
        teamFlights.push({ fromSid: sid, toSid: t.pm, t: 0, dur: 1.0, kind: 'report' });
        showInAppToast(`${sess.name} 보고 도착 → PM 검토 중`);
        if ((t.rounds || 0) >= 12) { teamLog(t, 'stop', '라운드 상한(12)에 도달해 자동 진행을 멈춥니다'); showInAppToast('팀 라운드 상한 도달', 'error'); continue; }
        const pmHandle = handles.get(t.pm); if (!pmHandle) continue;
        const ctxTxt = `팀원 "${sess.name}"의 보고: ${report.replace(/\s+/g, ' ').slice(0, 1500)}. 아직 진행 중인 팀원: ${Object.entries(t.tasks).filter(([s, k]) => !k.reported).map(([s]) => officeChars.get(s)?.sess?.name || s).join(', ') || '없음'}.`;
        const next = parseJsonLoose(await teamAsk(pmHandle, teamAssignPrompt(t, ctxTxt)));
        if (!next || !Array.isArray(next.assign)) { teamLog(t, 'error', 'PM 응답을 JSON으로 읽지 못했습니다'); continue; }
        teamReviewPlan(t, next, t.autoDispatch);
      } catch (e) { teamLog(t, 'error', e.message); }
      finally { teamLoopBusy = false; }
    }
  }
}
setInterval(teamTick, 2500);

function teamShowLog(t) {
  const lines = t.log.map(l => `${new Date(l.t).toLocaleTimeString(LANG === 'ko' ? 'ko-KR' : 'en-US')} [${l.type}${l.to ? '→' + l.to : ''}${l.from ? '←' + l.from : ''}] ${l.text}`).join('\n\n');
  teamModal(`<h3>팀 로그 · ${esc(officeChars.get(t.pm)?.sess?.name || 'PM')}</h3>
    ${t.brief ? `<p><b>브리프 v${t.briefVersion}</b></p><div class="brief">${esc(t.brief)}</div>` : ''}
    <div class="log" style="margin-top:8px">${esc(lines || '기록이 없습니다')}</div>
    <div class="row"><button id="team-close">닫기</button></div>`).querySelector('#team-close').onclick = closeTeamModal;
}
function teamMenuItems(sess) {
  const t = teamOf(sess.id); const items = [];
  if (!t) return items;
  if (t.pm === sess.id) {
    items.push(['🧭', '팀 목표 지시…', () => teamStartFlow(t)]);
    items.push(['📜', '팀 브리프·로그 보기', () => teamShowLog(t)]);
    items.push(['⏹', '자동 진행 ' + (t.autoDispatch ? '끄기' : '켜기'), () => { t.autoDispatch = !t.autoDispatch; teamsSave(); }]);
  } else {
    const task = t.tasks && t.tasks[sess.id];
    if (task && task.briefVersion != null && task.briefVersion < t.briefVersion) items.push(['⚠', `브리프 v${t.briefVersion} 다시 전달`, () => teamResendBrief(t, sess.id)]);
    for (const [role, label] of Object.entries(TEAM_ROLES)) if (t.members[sess.id] !== role) items.push(['🏷', `역할: ${label}`, () => { t.members[sess.id] = role; teamsSave(); }]);
    items.push(['📜', '팀 브리프·로그 보기', () => teamShowLog(t)]);
  }
  items.push(['↩', '팀에서 해제', () => teamUnpin(sess.id)]);
  return items;
}

window.addEventListener('resize', () => { if (currentPage === 'office' && officeReady) officeFrame(performance.now()); });

// PAGE 4: CLIPBOARD HISTORY
// ══════════════════════════════════════════
let clipHistory = [];
try { const saved = localStorage.getItem('orca-clip-history'); if (saved) clipHistory = JSON.parse(saved); } catch {}

function saveClipHistory() {
  try { localStorage.setItem('orca-clip-history', JSON.stringify(clipHistory.slice(0, 20))); } catch {}
}

async function loadClipboardHistory() {
  try {
    const current = await window.orca.clipboardRead();
    if (current && (!clipHistory.length || clipHistory[0].text !== current)) {
      clipHistory.unshift({ text: current, time: Date.now() });
      if (clipHistory.length > 20) clipHistory.pop();
      saveClipHistory();
    }
  } catch {}
  renderClipboard();
}

function renderClipboard() {
  const el = $('clip-list');
  if (!clipHistory.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">📋</span><span class="empty-text">클립보드 히스토리가 비어 있습니다</span></div>';
    return;
  }
  let html = '';
  for (const c of clipHistory) {
    html += `<div class="clip-item" data-clip="${esc(c.text)}">
      <div class="clip-text">${esc(trunc(c.text, 200))}</div>
      <span class="clip-time">${timeAgo(c.time)}</span>
    </div>`;
  }
  el.innerHTML = html;
}

$('clip-list').addEventListener('click', e => {
  const item = e.target.closest('.clip-item');
  if (!item) return;
  const text = item.dataset.clip;
  window.orca.clipboardWrite(text);
  item.classList.add('active');
  setTimeout(() => item.classList.remove('active'), 300);
  showInAppToast('복사됨');
});

$('clip-clear-btn').addEventListener('click', () => {
  clipHistory = [];
  saveClipHistory();
  renderClipboard();
});

setInterval(async () => {
  if (currentPage !== 'clipboard') return;
  try {
    const current = await window.orca.clipboardRead();
    if (current && (!clipHistory.length || clipHistory[0].text !== current)) {
      clipHistory.unshift({ text: current, time: Date.now() });
      if (clipHistory.length > 20) clipHistory.pop();
      saveClipHistory();
      renderClipboard();
    }
  } catch {}
}, 1000);

// PAGE 5: PORT MONITOR
// ══════════════════════════════════════════
let portData = [];

async function loadPorts() {
  $('port-list').innerHTML = '<div class="empty"><span class="empty-icon">🔌</span><span class="empty-text">스캔 중...</span></div>';
  try {
    portData = await window.orca.scanPorts();
    renderPorts();
  } catch {
    $('port-list').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><span class="empty-text">포트 스캔에 실패했습니다</span></div>';
  }
}

function renderPorts() {
  const el = $('port-list');
  if (!portData.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">✨</span><span class="empty-text">리스닝 중인 포트가 없습니다</span></div>';
    return;
  }
  let html = '';
  for (const p of portData) {
    html += `<div class="port-item">
      <span class="port-num">:${esc(String(p.port))}</span>
      <div class="port-info">
        <div class="port-name">${esc(p.name || 'unknown')}</div>
        <div class="port-pid">PID ${esc(String(p.pid))}${p.user ? ' · ' + esc(p.user) : ''}</div>
      </div>
      <button class="port-kill" data-pid="${p.pid}" title="프로세스 종료">종료</button>
    </div>`;
  }
  el.innerHTML = html;
}

$('port-refresh-btn').addEventListener('click', loadPorts);

$('port-list').addEventListener('click', async e => {
  const btn = e.target.closest('.port-kill');
  if (!btn) return;
  const pid = btn.dataset.pid;
  if (confirm(`PID ${pid} 프로세스를 종료하시겠습니까?`)) {
    try {
      await window.orca.killProcess(Number(pid));
      showInAppToast(`PID ${pid} 종료됨`);
      setTimeout(loadPorts, 500);
    } catch { showInAppToast(`PID ${pid} 종료 실패`, 'error'); }
  }
});

const memoEditor = $('memo-editor');
const memoStatus = $('memo-status');
const memoCharCount = $('memo-char-count');

try {
  const saved = localStorage.getItem('orca-memo');
  if (saved) memoEditor.value = saved;
  memoCharCount.textContent = memoEditor.value.length + '자';
} catch {}

memoEditor.addEventListener('input', () => {

// ══════════════════════════════════════════
// PAGE 7: POMODORO TIMER
// ══════════════════════════════════════════
const POMO_DURATIONS = { work: 25 * 60, short: 5 * 60, long: 15 * 60 };
let pomoMode = 'work';
let pomoRemaining = POMO_DURATIONS.work;
let pomoTotal = POMO_DURATIONS.work;
let pomoInterval = null;
let pomoRunning = false;
let pomoCompletedCount = 0;
try { const c = localStorage.getItem('orca-pomo-count'); if (c) pomoCompletedCount = Number(c); } catch {}
$('pomo-count').textContent = `완료: ${pomoCompletedCount}회`;

function formatPomo(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updatePomoDisplay() {
  $('pomo-display').textContent = formatPomo(pomoRemaining);
  const pct = pomoTotal > 0 ? ((pomoTotal - pomoRemaining) / pomoTotal) * 100 : 0;
  $('pomo-progress').style.width = pct + '%';
}

function pomoTick() {
  if (pomoRemaining <= 0) {
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoRunning = false;
    $('pomo-start').textContent = '시작';
    if (pomoMode === 'work') {
      pomoCompletedCount++;
      try { localStorage.setItem('orca-pomo-count', String(pomoCompletedCount)); } catch {}
      $('pomo-count').textContent = `완료: ${pomoCompletedCount}회`;
      window.orca.notify('뽀모도로', '집중 시간이 끝났습니다! 휴식하세요 ☕');
    } else {
      window.orca.notify('뽀모도로', '휴식이 끝났습니다! 다시 집중하세요 🔥');
    }
    updatePomoDisplay();
    return;
  }
  pomoRemaining--;
  updatePomoDisplay();
}

$('pomo-start').addEventListener('click', () => {
  if (pomoRunning) {
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoRunning = false;
    $('pomo-start').textContent = '계속';
  } else {
    if (pomoRemaining <= 0) {
      pomoRemaining = pomoTotal;
    }
    pomoRunning = true;
    pomoInterval = setInterval(pomoTick, 1000);
    $('pomo-start').textContent = '일시정지';
  }
});

$('pomo-reset').addEventListener('click', () => {
  clearInterval(pomoInterval);
  pomoInterval = null;
  pomoRunning = false;
  pomoRemaining = pomoTotal;
  $('pomo-start').textContent = '시작';
  updatePomoDisplay();
});

document.querySelectorAll('.pomo-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.pomo-mode-btn.active').classList.remove('active');
    btn.classList.add('active');
    pomoMode = btn.dataset.pomo;
    pomoTotal = POMO_DURATIONS[pomoMode];
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoRunning = false;
    pomoRemaining = pomoTotal;
    $('pomo-start').textContent = '시작';
    updatePomoDisplay();
  });
});

updatePomoDisplay();

// ── Elapsed timer for running sessions (updates every 1s) ──
function formatElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

// ── Start polling ──
fetchData();
setInterval(fetchData, POLL);
