function debateStatus(text) {
  $('debate-status').textContent = text;
}

function buildRelayPrompt(mode, topic, round, maxRounds, myName, peerNames, lastPeerMsg) {
  const peersStr = peerNames.join(', ');
  const modeLabel = mode === 'brainstorm' ? '브레인스톰' : mode === 'review' ? '코드리뷰' : '토론';
  const header = `[${modeLabel} - 라운드 ${round}/${maxRounds}]\n다른 세션(${peersStr})과 "${topic}" 주제로 대화 중입니다.\n메시지를 중계해 드리겠습니다. 상대에게 전달할 답변만 작성해 주세요.\n\n`;

  if (!lastPeerMsg) {
    return `${header}첫 번째 발언자입니다. "${topic}"에 대해 현재 작업의 맥락에서 의견을 3~5문장으로 제시해 주세요.`;
  }

  const relay = `상대 세션(${lastPeerMsg.name})의 메시지:\n\"\"\"${lastPeerMsg.text}\"\"\"\n\n`;
  if (mode === 'brainstorm') return `${header}${relay}위 의견을 참고하여 아이디어를 발전시키거나 새로운 제안을 3~5문장으로 해 주세요.`;
  if (mode === 'review') return `${header}${relay}위 의견에 대해 코드리뷰 관점에서 3~5문장으로 답변하세요.`;
  return `${header}${relay}위 의견에 대해 동의 또는 반론을 3~5문장으로 제시해 주세요.`;
}

async function sendAndCollect(handle, prompt, group) {
  const name = resolveHandleName(handle);
  const singleLinePrompt = prompt.replace(/\n+/g, ' ').trim();
  console.log(`[debate] sending to ${name} (${handle}), length: ${singleLinePrompt.length}`);

  try {
    const sendRes = await window.orca.terminalSend(handle, singleLinePrompt, true, 15);
    const stages = sendRes?.result?.send?.prompt?.stages || [];
    console.log(`[debate] send stages:`, stages);
    if (!sendRes?.result?.send?.accepted) {
      debateLog(null, `${name}: 전송이 거부되었습니다`, 'system');
      return null;
    }
    if (!stages.includes('turn_started')) {
      debateLog(null, `${name}: 세션이 처리를 시작하지 않았습니다 (입력 대기 상태인지 확인하세요)`, 'system');
      return null;
    }
  } catch (err) {
    console.error(`[debate] send error:`, err);
    debateLog(null, `${name}: 전송 실패 (${err.message})`, 'system');
    return null;
  }

  debateStatus(`${name} 응답 대기 중...`);
  try {
    await window.orca.terminalWait(handle, 'tui-idle', 180000);
    await new Promise(r => setTimeout(r, 800));
  } catch (err) {
    console.warn(`[debate] wait timeout/error:`, err);
  }

  if (!debateState.running) return null;

  let cleaned = '';
  try {
    const screenRes = await window.orca.terminalRead(handle, true);
    const lines = extractTail(screenRes);
    console.log(`[debate] screen after: ${lines.length} lines`);
    cleaned = extractLastResponse(lines);
    console.log(`[debate] extracted response (${cleaned.length} chars):`, cleaned.slice(0, 300));
  } catch (err) {
    console.warn(`[debate] screen read failed:`, err);
  }

  if (cleaned.length > 1500) cleaned = cleaned.slice(0, 1500) + '...';
  console.log(`[debate] final response (${cleaned.length} chars):`, cleaned.slice(0, 200));
  debateLog(handle, cleaned || '(응답 없음)', 'msg', group);
  return { name, text: cleaned || '(응답 없음)' };
}

async function runDebate() {
  const { groupA, groupB, topic, mode, maxRounds } = debateState;
  debateState.log = [];

  const namesA = groupA.map(h => resolveHandleName(h));
  const namesB = groupB.map(h => resolveHandleName(h));
  debateLog(null, `시작: [${namesA.join(', ')}] ↔ [${namesB.join(', ')}] | "${topic}" | ${maxRounds}라운드`, 'system');

  let lastMsgFromA = null;
  let lastMsgFromB = null;

  for (let round = 1; round <= maxRounds; round++) {
    if (!debateState.running) break;
    debateLog(null, `── 라운드 ${round}/${maxRounds} ──`, 'system');

    for (const handle of groupA) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`A: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt(mode, topic, round, maxRounds, myName, namesB, lastMsgFromB);
      lastMsgFromA = await sendAndCollect(handle, prompt, 'a');
    }
    if (!debateState.running) break;

    for (const handle of groupB) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`B: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt(mode, topic, round, maxRounds, myName, namesA, lastMsgFromA);
      lastMsgFromB = await sendAndCollect(handle, prompt, 'b');
    }
  }

  debateLog(null, debateState.running ? '토론이 완료되었습니다.' : '토론이 중단되었습니다.', 'system');
  debateStatus('');
  debateState.running = false;
  $('debate-start-btn').disabled = false;
  $('debate-stop-btn').disabled = true;
}

async function runMasterWorker() {
  const { groupA, groupB, master, topic, maxRounds } = debateState;
  debateState.log = [];

  const workers = [...groupA, ...groupB];
  const workerNames = workers.map(h => resolveHandleName(h));
  const masterName = resolveHandleName(master);
  debateLog(null, `마스터-워커 시작: 마스터(${masterName}) | 워커(${workerNames.join(', ')}) | "${topic}" | ${maxRounds}라운드`, 'system');

  const workerGroupA = groupA;
  const workerGroupB = groupB;
  const namesA = workerGroupA.map(h => resolveHandleName(h));
  const namesB = workerGroupB.map(h => resolveHandleName(h));

  let lastMsgFromA = null;
  let lastMsgFromB = null;

  for (let round = 1; round <= maxRounds; round++) {
    if (!debateState.running) break;
    debateLog(null, `── 워커 토론 라운드 ${round}/${maxRounds} ──`, 'system');

    for (const handle of workerGroupA) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`워커 A: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt('debate', topic, round, maxRounds, myName, namesB, lastMsgFromB);
      lastMsgFromA = await sendAndCollect(handle, prompt, 'a');
    }
    if (!debateState.running) break;

    for (const handle of workerGroupB) {
      if (!debateState.running) break;
      const myName = resolveHandleName(handle);
      debateStatus(`워커 B: ${myName}에게 전달 중...`);
      const prompt = buildRelayPrompt('debate', topic, round, maxRounds, myName, namesA, lastMsgFromA);
      lastMsgFromB = await sendAndCollect(handle, prompt, 'b');
    }
  }

  if (!debateState.running) {
    debateLog(null, '중단되었습니다.', 'system');
    debateStatus('');
    debateState.running = false;
    $('debate-start-btn').disabled = false;
    $('debate-stop-btn').disabled = true;
    return;
  }

  debateLog(null, `── 워커 토론 완료, 마스터에게 결과 전달 ──`, 'system');
  debateStatus(`마스터(${masterName})에게 최종 결과 전달 중...`);

  const allMessages = debateState.log
    .filter(m => m.type === 'msg')
    .map(m => `[${m.group === 'a' ? 'A' : 'B'}] ${resolveHandleName(m.sender)}: ${m.text}`);

  let condensed = allMessages.join(' | ');
  if (condensed.length > 3000) {
    const lastA = allMessages.filter(m => m.startsWith('[A]')).slice(-1)[0] || '';
    const lastB = allMessages.filter(m => m.startsWith('[B]')).slice(-1)[0] || '';
    condensed = `[최종 A 의견] ${lastA.slice(4)} | [최종 B 의견] ${lastB.slice(4)}`;
  }

  const summaryPrompt = `워커들이 "${topic}" 주제로 ${maxRounds}라운드 토론했습니다. 참여: ${workerNames.join(', ')}. 토론 요약: ${condensed} --- 위 내용을 분석하여 1)핵심 합의 2)쟁점 3)최종 결론을 정리해 주세요.`;

  console.log(`[debate] master prompt length: ${summaryPrompt.length}`);
  debateLog(null, `마스터에게 전달 중 (프롬프트 ${summaryPrompt.length}자)...`, 'system');

  const masterResult = await sendAndCollect(master, summaryPrompt, 'master');
  if (masterResult) {
    debateLog(null, `마스터(${masterName})의 최종 정리가 완료되었습니다.`, 'system');
  } else {
    debateLog(null, `마스터(${masterName})에게 전달하지 못했습니다. 마스터 세션이 입력 대기 상태(❯)인지 확인하세요.`, 'system');
  }

  debateLog(null, '마스터-워커 흐름이 완료되었습니다.', 'system');
  debateStatus('');
  debateState.running = false;
  $('debate-start-btn').disabled = false;
  $('debate-stop-btn').disabled = true;
}

$('debate-start-btn').addEventListener('click', () => {
  const topic = $('debate-topic').value.trim();
  if (!topic) { showInAppToast('주제를 입력하세요', 'error'); return; }
  const mode = $('debate-mode').value;
  if (mode === 'master-worker') {
    if (!debateState.master) { showInAppToast('마스터 세션을 배치하세요', 'error'); return; }
    const workers = [...debateState.groupA, ...debateState.groupB];
    if (workers.length < 2) { showInAppToast('워커 세션을 2개 이상 배치하세요 (A, B 그룹에 나눠서)', 'error'); return; }
  } else {
    if (!debateState.groupA.length || !debateState.groupB.length) {
      showInAppToast('A 그룹과 B 그룹에 각각 세션을 배치하세요', 'error');
      return;
    }
  }
  debateState.topic = topic;
  debateState.mode = mode;
  debateState.maxRounds = parseInt($('debate-rounds').value, 10);
  debateState.running = true;
  $('debate-start-btn').disabled = true;
  $('debate-stop-btn').disabled = false;
  if (mode === 'master-worker') runMasterWorker();
  else runDebate();
});

$('debate-stop-btn').addEventListener('click', () => {
  debateState.running = false;
  debateStatus('중단 중...');
  $('debate-stop-btn').disabled = true;
});

// ══════════════════════════════════════════
// CHAT PANEL (Dashboard)
// ══════════════════════════════════════════
let chatHandle = null;
let chatSending = false;

function openChat(handle) {
  chatHandle = handle;
  const panel = $('chat-panel');
  panel.classList.add('open');

  const sid = [...handles.entries()].find(([, v]) => v === handle)?.[0];
  const s = sessions.find(ss => ss.id === sid);
  $('chat-name').textContent = s?.name || handle.slice(0, 16);

  $('chat-screen').innerHTML = '<div class="chat-line-status">화면을 불러오는 중...</div>';
  $('chat-input').value = '';
  $('chat-input').disabled = false;
  $('chat-send').disabled = false;
  $('chat-input').focus();

  refreshChatScreen(handle);
}

async function refreshChatScreen(handle) {
  try {
    const res = await window.orca.terminalRead(handle, true);
    const lines = extractTail(res);
    renderChatScreen(lines);
    const status = detectTerminalStatus(lines);
    updateChatStatus(status);
  } catch (err) {
    $('chat-screen').innerHTML = `<div class="chat-line-status">화면 읽기 실패: ${esc(err.message)}</div>`;
    updateChatStatus('offline');
  }
}

function renderChatScreen(lines) {
  const el = $('chat-screen');
  let html = '';
  for (const line of lines) {
    const t = line.trim();
    if (!t) { html += '\n'; continue; }
    if (t.startsWith('❯')) {
      html += `<div class="chat-line-prompt">${esc(line)}</div>`;
    } else if (t.startsWith('⏺')) {
      html += `<div class="chat-line-response">${esc(line)}</div>`;
    } else if (t.includes('✻') && t.includes('done')) {
      html += `<div class="chat-line-done">${esc(line)}</div>`;
    } else if (t.startsWith('────') || t.includes('[OMC#') || t.includes('bypass permissions') || t.startsWith('branch:')) {
      html += `<div class="chat-line-status">${esc(line)}</div>`;
    } else {
      html += `<div class="chat-line-response">${esc(line)}</div>`;
    }
  }
  el.innerHTML = html;
  el.scrollTop = el.scrollHeight;
}

function updateChatStatus(status) {
  const el = $('chat-status');
  el.className = 'chat-header-status ' + status;
  if (status === 'idle') el.textContent = '대기 중';
  else if (status === 'busy') el.textContent = '작업 중';
  else el.textContent = '오프라인';
}

async function sendChatMessage() {
  if (chatSending || !chatHandle) return;
  const input = $('chat-input');
  const text = input.value.trim();
  if (!text) return;

  chatSending = true;
  input.disabled = true;
  $('chat-send').disabled = true;
  updateChatStatus('busy');

  const el = $('chat-screen');
  el.innerHTML += `<div class="chat-line-prompt">❯ ${esc(text)}</div>`;
  el.innerHTML += `<div class="chat-line-status">전송 중...</div>`;
  el.scrollTop = el.scrollHeight;
  input.value = '';

  try {
    const sendRes = await window.orca.terminalSend(chatHandle, text, true, 15);
    const stages = sendRes?.result?.send?.prompt?.stages || [];
    if (!sendRes?.result?.send?.accepted) {
      el.innerHTML += `<div class="chat-line-status" style="color:var(--red)">전송이 거부되었습니다</div>`;
      chatSending = false;
      input.disabled = false;
      $('chat-send').disabled = false;
      return;
    }
    if (!stages.includes('turn_started')) {
      el.innerHTML += `<div class="chat-line-status" style="color:var(--yellow)">세션이 입력 대기 상태가 아닙니다</div>`;
      chatSending = false;
      input.disabled = false;
      $('chat-send').disabled = false;
      return;
    }

    el.innerHTML += `<div class="chat-line-status">응답 대기 중...</div>`;
    el.scrollTop = el.scrollHeight;

    await window.orca.terminalWait(chatHandle, 'tui-idle', 180000);
    await new Promise(r => setTimeout(r, 800));

    await refreshChatScreen(chatHandle);
  } catch (err) {
    el.innerHTML += `<div class="chat-line-status" style="color:var(--red)">오류: ${esc(err.message)}</div>`;
    el.scrollTop = el.scrollHeight;
  } finally {
    chatSending = false;
    input.disabled = false;
    $('chat-send').disabled = false;
    input.focus();
  }
}

$('chat-send').addEventListener('click', sendChatMessage);
$('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});
$('chat-close').addEventListener('click', () => {
  $('chat-panel').classList.remove('open');
  chatHandle = null;
});
$('chat-refresh').addEventListener('click', () => {
  if (chatHandle) refreshChatScreen(chatHandle);
});
$('chat-orca').addEventListener('click', () => {
  if (chatHandle) api.switchTo(chatHandle);
});

// ══════════════════════════════════════════
// PAGE 4: CLIPBOARD HISTORY
// ══════════════════════════════════════════
let clipHistory = [];
try { const saved = localStorage.getItem('orca-clip-history'); if (saved) clipHistory = JSON.parse(saved); } catch {}

function saveClipHistory() {
  try { localStorage.setItem('orca-clip-history', JSON.stringify(clipHistory.slice(0, 20))); } catch {}
}

async function loadClipboardHistory() {
  try {
    const current = await window.orca.clipboardRead();
    if (current && (!clipHistory.length || clipHistory[0].text !== current)) {
      clipHistory.unshift({ text: current, time: Date.now() });
      if (clipHistory.length > 20) clipHistory.pop();
      saveClipHistory();
    }
  } catch {}
  renderClipboard();
}

function renderClipboard() {
  const el = $('clip-list');
  if (!clipHistory.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">📋</span><span class="empty-text">클립보드 히스토리가 비어 있습니다</span></div>';
    return;
  }
  let html = '';
  for (const c of clipHistory) {
    html += `<div class="clip-item" data-clip="${esc(c.text)}">
      <div class="clip-text">${esc(trunc(c.text, 200))}</div>
      <span class="clip-time">${timeAgo(c.time)}</span>
    </div>`;
  }
  el.innerHTML = html;
}

$('clip-list').addEventListener('click', e => {
  const item = e.target.closest('.clip-item');
  if (!item) return;
  const text = item.dataset.clip;
  window.orca.clipboardWrite(text);
  item.classList.add('active');
  setTimeout(() => item.classList.remove('active'), 300);
  showInAppToast('복사됨');
});

$('clip-clear-btn').addEventListener('click', () => {
  clipHistory = [];
  saveClipHistory();
  renderClipboard();
});

setInterval(async () => {
  if (currentPage !== 'clipboard') return;
  try {
    const current = await window.orca.clipboardRead();
    if (current && (!clipHistory.length || clipHistory[0].text !== current)) {
      clipHistory.unshift({ text: current, time: Date.now() });
      if (clipHistory.length > 20) clipHistory.pop();
      saveClipHistory();
      renderClipboard();
    }
  } catch {}
}, 1000);

// ══════════════════════════════════════════
// PAGE 5: PORT MONITOR
// ══════════════════════════════════════════
let portData = [];

async function loadPorts() {
  $('port-list').innerHTML = '<div class="empty"><span class="empty-icon">🔌</span><span class="empty-text">스캔 중...</span></div>';
  try {
    portData = await window.orca.scanPorts();
    renderPorts();
  } catch {
    $('port-list').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span><span class="empty-text">포트 스캔에 실패했습니다</span></div>';
  }
}

function renderPorts() {
  const el = $('port-list');
  if (!portData.length) {
    el.innerHTML = '<div class="empty"><span class="empty-icon">✨</span><span class="empty-text">리스닝 중인 포트가 없습니다</span></div>';
    return;
  }
  let html = '';
  for (const p of portData) {
    html += `<div class="port-item">
      <span class="port-num">:${esc(String(p.port))}</span>
      <div class="port-info">
        <div class="port-name">${esc(p.name || 'unknown')}</div>
        <div class="port-pid">PID ${esc(String(p.pid))}${p.user ? ' · ' + esc(p.user) : ''}</div>
      </div>
      <button class="port-kill" data-pid="${p.pid}" title="프로세스 종료">종료</button>
    </div>`;
  }
  el.innerHTML = html;
}

$('port-refresh-btn').addEventListener('click', loadPorts);

$('port-list').addEventListener('click', async e => {
  const btn = e.target.closest('.port-kill');
  if (!btn) return;
  const pid = btn.dataset.pid;
  if (confirm(`PID ${pid} 프로세스를 종료하시겠습니까?`)) {
    try {
      await window.orca.killProcess(Number(pid));
      showInAppToast(`PID ${pid} 종료됨`);
      setTimeout(loadPorts, 500);
    } catch { showInAppToast(`PID ${pid} 종료 실패`, 'error'); }
  }
});

// PAGE 6: MEMO
// ══════════════════════════════════════════
const memoEditor = $('memo-editor');
const memoStatus = $('memo-status');
const memoCharCount = $('memo-char-count');
let memoSaveTimer = null;

try {
  const saved = localStorage.getItem('orca-memo');
  if (saved) memoEditor.value = saved;
  memoCharCount.textContent = memoEditor.value.length + '자';
} catch {}

memoEditor.addEventListener('input', () => {
  memoCharCount.textContent = memoEditor.value.length + '자';
  memoStatus.textContent = '저장 중...';
  memoStatus.classList.remove('saved');
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(() => {
    try { localStorage.setItem('orca-memo', memoEditor.value); } catch {}
    memoStatus.textContent = '저장됨';
    memoStatus.classList.add('saved');
    setTimeout(() => { memoStatus.textContent = ''; memoStatus.classList.remove('saved'); }, 1500);
  }, 500);
});

// ══════════════════════════════════════════
// PAGE 7: POMODORO TIMER
// ══════════════════════════════════════════
const POMO_DURATIONS = { work: 25 * 60, short: 5 * 60, long: 15 * 60 };
let pomoMode = 'work';
let pomoRemaining = POMO_DURATIONS.work;
let pomoTotal = POMO_DURATIONS.work;
let pomoInterval = null;
let pomoRunning = false;
let pomoCompletedCount = 0;
try { const c = localStorage.getItem('orca-pomo-count'); if (c) pomoCompletedCount = Number(c); } catch {}
$('pomo-count').textContent = `완료: ${pomoCompletedCount}회`;

function formatPomo(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function updatePomoDisplay() {
  $('pomo-display').textContent = formatPomo(pomoRemaining);
  const pct = pomoTotal > 0 ? ((pomoTotal - pomoRemaining) / pomoTotal) * 100 : 0;
  $('pomo-progress').style.width = pct + '%';
}

function pomoTick() {
  if (pomoRemaining <= 0) {
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoRunning = false;
    $('pomo-start').textContent = '시작';
    if (pomoMode === 'work') {
      pomoCompletedCount++;
      try { localStorage.setItem('orca-pomo-count', String(pomoCompletedCount)); } catch {}
      $('pomo-count').textContent = `완료: ${pomoCompletedCount}회`;
      window.orca.notify('뽀모도로', '집중 시간이 끝났습니다! 휴식하세요 ☕');
    } else {
      window.orca.notify('뽀모도로', '휴식이 끝났습니다! 다시 집중하세요 🔥');
    }
    updatePomoDisplay();
    return;
  }
  pomoRemaining--;
  updatePomoDisplay();
}

$('pomo-start').addEventListener('click', () => {
  if (pomoRunning) {
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoRunning = false;
    $('pomo-start').textContent = '계속';
  } else {
    if (pomoRemaining <= 0) {
      pomoRemaining = pomoTotal;
    }
    pomoRunning = true;
    pomoInterval = setInterval(pomoTick, 1000);
    $('pomo-start').textContent = '일시정지';
  }
});

$('pomo-reset').addEventListener('click', () => {
  clearInterval(pomoInterval);
  pomoInterval = null;
  pomoRunning = false;
  pomoRemaining = pomoTotal;
  $('pomo-start').textContent = '시작';
  updatePomoDisplay();
});

document.querySelectorAll('.pomo-mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.pomo-mode-btn.active').classList.remove('active');
    btn.classList.add('active');
    pomoMode = btn.dataset.pomo;
    pomoTotal = POMO_DURATIONS[pomoMode];
    clearInterval(pomoInterval);
    pomoInterval = null;
    pomoRunning = false;
    pomoRemaining = pomoTotal;
    $('pomo-start').textContent = '시작';
    updatePomoDisplay();
  });
});

updatePomoDisplay();

// ── Elapsed timer for running sessions (updates every 1s) ──
function formatElapsed(ms) {
  const s = Math.floor(ms / 1000);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `${m}:${String(sec).padStart(2,'0')}`;
}

setInterval(() => {
  document.querySelectorAll('.s-elapsed[data-start]').forEach(el => {
    const start = Number(el.dataset.start);
    if (start) el.textContent = '▶ ' + formatElapsed(Date.now() - start);
  });
}, 1000);

// ── Start polling ──
fetchData();
setInterval(fetchData, POLL);
</script>
